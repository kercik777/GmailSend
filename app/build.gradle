plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gmail'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gmail'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 3
        versionName '2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    // true  → как в оригинале: положить jakarta.mail-2.0.2.jar и
    //         jakarta.activation-2.0.1.jar в app/libs/
    // false → те же библиотеки из Maven Central (собирается из коробки).
    def useOriginalJars = false

    // Библиотеки из исходного проекта (jakarta.mail 2.0.2 + jakarta.activation 2.0.1).
    if (useOriginalJars) {
        implementation fileTree(dir: 'libs', include: ['*.jar'])
    } else {
        implementation 'com.sun.mail:jakarta.mail:2.0.2'
        implementation 'com.sun.activation:jakarta.activation:2.0.1'
    }

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'com.google.android.material:material:1.12.0'
}
