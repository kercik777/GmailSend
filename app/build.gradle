plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gmail'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gmail'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Шифрованное хранение почты и пароля приложения (Android Keystore).
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // JavaMail, адаптированный под Android (javax.mail + javax.activation).
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
